<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .thumbnail {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
    background: linear-gradient(135deg, {{BG_DARK}} 0%, #1e293b 50%, {{PRIMARY}} 100%);
    position: relative;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,{{OVERLAY_OPACITY}});
  }
  .content {
    position: relative;
    z-index: 1;
  }
  .headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: {{HEADLINE_SIZE}}px;
    font-weight: bold;
    color: {{TEXT_LIGHT}};
    line-height: 1.1;
    margin-bottom: 20px;
    text-shadow: 0 2px {{TEXT_SHADOW_BLUR}}px rgba(0,0,0,0.5);
    max-width: 80%;
  }
  .subhead {
    font-size: {{SUBHEAD_SIZE}}px;
    font-weight: 700;
    color: {{ACCENT}};
    line-height: 1.3;
    max-width: 70%;
  }
  .brand-badge {
    position: absolute;
    bottom: 32px;
    right: 40px;
    background: {{PRIMARY}};
    color: {{TEXT_LIGHT}};
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 10px 24px;
    border-radius: 6px;
  }
  .format-badge {
    position: absolute;
    top: 32px;
    left: 40px;
    background: rgba(255,255,255,0.15);
    color: {{TEXT_LIGHT}};
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    padding: 8px 20px;
    border-radius: 4px;
    backdrop-filter: blur(8px);
  }
</style>
</head>
<body>
<div class="thumbnail">
  <div class="overlay"></div>
  <div class="format-badge">{{FORMAT_LABEL}}</div>
  <div class="content">
    <div class="headline">{{HOOK_LINE}}</div>
    <div class="subhead">{{SUBTITLE}}</div>
  </div>
  <div class="brand-badge">Collective Family</div>
</div>
</body>
</html>
