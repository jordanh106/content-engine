<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .content-slide {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: calc({{PADDING}}px * 1.5);
    background: {{BACKGROUND}};
    position: relative;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    margin-bottom: 56px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: {{PRIMARY}};
  }
  .page-counter {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: {{MUTED}};
  }
  .header-zone {
    margin-bottom: 24px;
  }
  .number-row {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 36px;
  }
  .big-number {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 92px;
    font-weight: 400;
    color: {{TEXT}};
    line-height: 1;
    letter-spacing: -0.025em;
  }
  .number-rule {
    flex: 1;
    height: 1px;
    background: {{MUTED}};
    opacity: 0.3;
    margin-bottom: 14px;
  }
  .point-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: calc({{TITLE_SIZE}}px * 1.1);
    font-weight: 400;
    color: {{TEXT}};
    line-height: 1.2;
    letter-spacing: -0.008em;
    margin-bottom: 26px;
    max-width: 94%;
  }
  .point-body {
    font-size: {{BODY_SIZE}}px;
    font-weight: 300;
    color: {{MUTED}};
    line-height: 1.6;
    max-width: 86%;
  }
  .brand-mark {
    position: absolute;
    bottom: 48px;
    left: calc({{PADDING}}px * 1.5);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    color: {{MUTED}};
  }
</style>
</head>
<body>
<div class="content-slide">
  <div class="top-row">
    <div class="eyebrow">Fact {{POINT_NUMBER}}</div>
    <div class="page-counter">{{SLIDE_INDEX}} / {{TOTAL_SLIDES}}</div>
  </div>
  <div class="header-zone">
    <div class="number-row">
      <div class="big-number">{{POINT_NUMBER}}</div>
      <div class="number-rule"></div>
    </div>
    <div class="point-title">{{POINT_TITLE}}</div>
    <div class="point-body">{{POINT_BODY}}</div>
  </div>
  <div class="brand-mark">Collective Family Chiropractic</div>
</div>
</body>
</html>
