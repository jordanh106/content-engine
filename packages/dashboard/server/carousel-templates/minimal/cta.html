<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .cta-slide {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: calc({{PADDING}}px * 1.5);
    background: {{BACKGROUND}};
    position: relative;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: {{PRIMARY}};
    margin-bottom: 36px;
  }
  .cta-headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: calc({{HEADLINE_SIZE}}px * 1.05);
    font-weight: 400;
    color: {{TEXT}};
    line-height: 1.15;
    letter-spacing: -0.005em;
    margin-bottom: 32px;
    max-width: 88%;
  }
  .cta-subhead {
    font-size: {{SUBHEAD_SIZE}}px;
    font-weight: 300;
    color: {{MUTED}};
    line-height: 1.55;
    margin-bottom: 56px;
    max-width: 78%;
  }
  .cta-button {
    display: inline-block;
    border: 2px solid {{TEXT}};
    background: transparent;
    color: {{TEXT}};
    font-size: {{BUTTON_SIZE}}px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    padding: {{BUTTON_PV}}px {{BUTTON_PH}}px;
    border-radius: 4px;
  }
  .brand-mark {
    position: absolute;
    bottom: 48px;
    left: calc({{PADDING}}px * 1.5);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: {{MUTED}};
  }
</style>
</head>
<body>
<div class="cta-slide">
  <div class="eyebrow">One more thing</div>
  <div class="cta-headline">{{CTA_HEADLINE}}</div>
  <div class="cta-subhead">{{CTA_SUBHEAD}}</div>
  <div class="cta-button">{{CTA_BUTTON_TEXT}}</div>
  <div class="brand-mark">Collective Family Chiropractic</div>
</div>
</body>
</html>
