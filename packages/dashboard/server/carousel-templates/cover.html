<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .cover {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: {{PADDING}}px;
    background: linear-gradient({{GRADIENT_ANGLE}}deg, {{BG_DARK}} 0%, {{PRIMARY}} 100%);
    position: relative;
  }
  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: {{ACCENT_BAR_HEIGHT}}px;
    background: {{ACCENT}};
  }
  .slide-number {
    position: absolute;
    top: 24px;
    right: 32px;
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.4);
  }
  .headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: {{HEADLINE_SIZE}}px;
    font-weight: bold;
    color: {{TEXT_LIGHT}};
    line-height: 1.15;
    margin-bottom: 24px;
    max-width: 90%;
  }
  .subhead {
    font-size: {{SUBHEAD_SIZE}}px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    line-height: 1.4;
    max-width: 80%;
  }
  .swipe-indicator {
    position: absolute;
    bottom: 32px;
    right: 32px;
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1em;
  }
  .brand-mark {
    position: absolute;
    bottom: 32px;
    left: 32px;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
<div class="cover">
  <div class="accent-bar"></div>
  <div class="slide-number">1 / {{TOTAL_SLIDES}}</div>
  <div class="headline">{{HOOK_LINE}}</div>
  <div class="subhead">{{SUBTITLE}}</div>
  <div class="swipe-indicator">SWIPE &rarr;</div>
  <div class="brand-mark">Collective Family Chiropractic</div>
</div>
</body>
</html>
