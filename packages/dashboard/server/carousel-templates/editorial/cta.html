<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .cta-slide {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: {{PADDING}}px;
    background: linear-gradient({{GRADIENT_ANGLE}}deg, {{BG_DARK}} 0%, {{PRIMARY}} 100%);
    position: relative;
  }
  .accent-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: {{ACCENT_BAR_HEIGHT}}px;
    background: {{ACCENT}};
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: {{ACCENT}};
  }
  .page-counter {
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.5);
  }
  .body-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-bottom: 28px;
  }
  .rule {
    width: 96px;
    height: 3px;
    background: {{ACCENT}};
    margin-bottom: 32px;
  }
  .cta-headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: {{HEADLINE_SIZE}}px;
    font-weight: bold;
    color: {{TEXT_LIGHT}};
    line-height: 1.12;
    letter-spacing: -0.012em;
    margin-bottom: 24px;
    max-width: 90%;
  }
  .cta-subhead {
    font-size: {{SUBHEAD_SIZE}}px;
    font-weight: 400;
    color: rgba(255,255,255,0.78);
    line-height: 1.45;
    margin-bottom: 48px;
    max-width: 84%;
  }
  .cta-button {
    align-self: flex-start;
    display: inline-block;
    background: {{TEXT_LIGHT}};
    color: {{PRIMARY}};
    font-size: {{BUTTON_SIZE}}px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    padding: {{BUTTON_PV}}px {{BUTTON_PH}}px;
    border-radius: {{BUTTON_RADIUS}}px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
  }
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
  }
  .brand-mark {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
<div class="cta-slide">
  <div class="top-row">
    <div class="eyebrow">One more thing</div>
    <div class="page-counter">{{SLIDE_INDEX}} / {{TOTAL_SLIDES}}</div>
  </div>
  <div class="body-zone">
    <div class="rule"></div>
    <div class="cta-headline">{{CTA_HEADLINE}}</div>
    <div class="cta-subhead">{{CTA_SUBHEAD}}</div>
    <div class="cta-button">{{CTA_BUTTON_TEXT}}</div>
  </div>
  <div class="footer-row">
    <div class="brand-mark">Collective Family Chiropractic</div>
  </div>
  <div class="accent-bar"></div>
</div>
</body>
</html>
