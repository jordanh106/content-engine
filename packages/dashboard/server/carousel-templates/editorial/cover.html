<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .cover {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    padding: {{PADDING}}px;
    background: linear-gradient({{GRADIENT_ANGLE}}deg, {{BG_DARK}} 0%, {{PRIMARY}} 100%);
    position: relative;
  }
  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: {{ACCENT_BAR_HEIGHT}}px;
    background: {{ACCENT}};
  }
  .eyebrow {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 28px;
  }
  .headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: {{HEADLINE_SIZE}}px;
    font-weight: bold;
    color: {{TEXT_LIGHT}};
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin-bottom: 28px;
    max-width: 92%;
  }
  .subhead {
    font-size: {{SUBHEAD_SIZE}}px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    line-height: 1.45;
    max-width: 80%;
  }
  .footer-row {
    position: absolute;
    bottom: 36px;
    left: {{PADDING}}px;
    right: {{PADDING}}px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand-mark {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.45);
  }
  .swipe-indicator {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.12em;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="accent-bar"></div>
  <div class="eyebrow">Did you know</div>
  <div class="headline">{{HOOK_LINE}}</div>
  <div class="subhead">{{SUBTITLE}}</div>
  <div class="footer-row">
    <div class="brand-mark">Collective Family Chiropractic</div>
    <div class="swipe-indicator">SWIPE &rarr;</div>
  </div>
</div>
</body>
</html>
