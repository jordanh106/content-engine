<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .cover {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: {{PADDING}}px;
    background: linear-gradient({{GRADIENT_ANGLE}}deg, {{BG_DARK}} 0%, {{PRIMARY}} 100%);
    position: relative;
  }
  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: {{ACCENT_BAR_HEIGHT}}px;
    background: {{ACCENT}};
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: {{ACCENT}};
  }
  .page-counter {
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.5);
  }
  .body-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-bottom: 28px;
  }
  .rule {
    width: 96px;
    height: 3px;
    background: {{ACCENT}};
    margin-bottom: 32px;
  }
  .headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: {{HEADLINE_SIZE}}px;
    font-weight: bold;
    color: {{TEXT_LIGHT}};
    line-height: 1.06;
    letter-spacing: -0.015em;
    margin-bottom: 30px;
    max-width: 94%;
  }
  .subhead {
    font-size: {{SUBHEAD_SIZE}}px;
    font-weight: 400;
    color: rgba(255,255,255,0.78);
    line-height: 1.45;
    max-width: 82%;
  }
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
  }
  .brand-mark {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.5);
  }
  .swipe-indicator {
    font-size: 13px;
    font-weight: 900;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="accent-bar"></div>
  <div class="top-row">
    <div class="eyebrow">Did you know</div>
    <div class="page-counter">01 / {{TOTAL_SLIDES}}</div>
  </div>
  <div class="body-zone">
    <div class="rule"></div>
    <div class="headline">{{HOOK_LINE}}</div>
    <div class="subhead">{{SUBTITLE}}</div>
  </div>
  <div class="footer-row">
    <div class="brand-mark">Collective Family Chiropractic</div>
    <div class="swipe-indicator">Swipe &rarr;</div>
  </div>
</div>
</body>
</html>
