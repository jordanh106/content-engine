<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: {{BG_DARK}};
  }
  .content-slide {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background-image: url('{{BG_IMAGE_URL}}');
    background-size: cover;
    background-position: center;
    background-color: {{BG_DARK}};
  }
  .veil {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.22) 22%,
      rgba(0,0,0,0.65) 68%,
      rgba(0,0,0,0.92) 100%
    );
  }
  .frame {
    position: absolute;
    inset: calc({{PADDING}}px * 1.0);
    display: flex;
    flex-direction: column;
    color: #ffffff;
  }
  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.22);
  }
  .masthead-brand {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.86);
  }
  .masthead-counter {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.6);
  }
  .body-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 12px;
  }
  .number-row {
    display: flex;
    align-items: flex-end;
    gap: 28px;
    margin-bottom: 32px;
  }
  .big-number {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: {{NUMBER_SIZE}}px;
    font-weight: 700;
    color: {{ACCENT}};
    line-height: 0.85;
    letter-spacing: -0.04em;
    flex-shrink: 0;
    text-shadow:
      0 4px 20px rgba(0,0,0,0.45),
      0 2px 8px rgba(225,29,72,0.18);
  }
  .number-meta {
    flex: 1;
    padding-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .meta-eyebrow {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: {{ACCENT}};
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .meta-label {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    color: rgba(255,255,255,0.72);
    line-height: 1.3;
    text-shadow: 0 1px 8px rgba(0,0,0,0.45);
  }
  .meta-rule {
    width: 48px;
    height: 1px;
    background: rgba(255,255,255,0.34);
  }
  .point-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: {{TITLE_SIZE}}px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.06;
    letter-spacing: -0.018em;
    margin-bottom: 22px;
    max-width: 94%;
    text-shadow:
      0 2px 14px rgba(0,0,0,0.55),
      0 4px 28px rgba(0,0,0,0.35);
  }
  .point-body {
    font-size: {{BODY_SIZE}}px;
    font-weight: 400;
    color: rgba(255,255,255,0.92);
    line-height: 1.46;
    max-width: 90%;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .progress-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 22px;
  }
  .progress-fill {
    height: 100%;
    background: {{ACCENT}};
    border-radius: 999px;
    width: calc(({{SLIDE_INDEX}} / {{TOTAL_SLIDES}}) * 100%);
    box-shadow: 0 0 12px rgba(225,29,72,0.55);
  }
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
  }
  .footer-label {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.62);
  }
  .footer-swipe {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: {{ACCENT}};
  }
</style>
</head>
<body>
<div class="content-slide">
  <div class="veil"></div>
  <div class="frame">
    <div class="masthead">
      <div class="masthead-brand">Collective Family Chiropractic</div>
      <div class="masthead-counter">{{SLIDE_INDEX}} / {{TOTAL_SLIDES}}</div>
    </div>
    <div class="body-zone">
      <div class="number-row">
        <div class="big-number">{{POINT_NUMBER}}</div>
        <div class="number-meta">
          <div class="meta-eyebrow">The case</div>
          <div class="meta-label">Fact no. {{POINT_NUMBER}} of {{TOTAL_SLIDES}}</div>
          <div class="meta-rule"></div>
        </div>
      </div>
      <div class="point-title">{{POINT_TITLE}}</div>
      <div class="point-body">{{POINT_BODY}}</div>
    </div>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="footer-row">
      <div class="footer-label">Did you know</div>
      <div class="footer-swipe">Swipe &rarr;</div>
    </div>
  </div>
</div>
</body>
</html>
